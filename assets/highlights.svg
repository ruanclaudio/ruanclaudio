<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 110" width="1000" height="110" role="img" aria-label="Highlights" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Highlights</title>

  <style>
    .card { fill: none; stroke: #8F0D87; stroke-width: 1.6; opacity: 0.85; }
    .val  {
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 28px; font-weight: 700; fill: #9304F7;
    }
    .lab  {
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 10.5px; font-weight: 600; fill: #808080; letter-spacing: 1.1px;
    }
    .spec  {
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px; font-weight: 700; fill: #EDE2F7;
    }
    .glow { animation: pulse 4s ease-in-out infinite; }
    .g1 { animation-delay: -0.8s; }
    .g2 { animation-delay: -1.6s; }
    .g3 { animation-delay: -2.4s; }
    .g4 { animation-delay: -3.2s; }

    @keyframes pulse {
      0%, 100% { opacity: 0.45; }
      50%      { opacity: 1.00; }
    }
  </style>

  <!-- Years of experience -->
  <g>
    <rect class="card glow" x="10" y="10" width="188" height="90" rx="10"/>
    <text class="val" x="104" y="52" text-anchor="middle">5+</text>
    <text class="lab" x="104" y="74" text-anchor="middle">YEARS OF EXPERIENCE</text>
  </g>

  <!-- Computer Science -->
  <g>
    <rect class="card glow g1" x="208" y="10" width="188" height="90" rx="10"/>
    <text class="val" x="302" y="52" text-anchor="middle">B.Sc.</text>
    <text class="lab" x="302" y="74" text-anchor="middle">COMPUTER SCIENCE</text>
  </g>

  <!-- Backend Architecture badge -->
  <g>
    <rect class="card glow g2" x="406" y="10" width="188" height="90" rx="10"/>
    <path d="M470 38 h68 M470 50 h68 M470 62 h68" stroke="#9304F7" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="470" cy="38" r="3" fill="#9304F7"/>
    <circle cx="470" cy="50" r="3" fill="#9304F7"/>
    <circle cx="470" cy="62" r="3" fill="#9304F7"/>
    <text class="spec" x="500" y="88" text-anchor="middle">Backend Architecture</text>
  </g>

  <!-- Data Engineering badge -->
  <g>
    <rect class="card glow g3" x="604" y="10" width="188" height="90" rx="10"/>
    <ellipse cx="698" cy="34" rx="16" ry="6" fill="none" stroke="#9304F7" stroke-width="2.2"/>
    <path d="M682 34 v18 a16 6 0 0 0 32 0 v-18" fill="none" stroke="#9304F7" stroke-width="2.2"/>
    <path d="M682 43 a16 6 0 0 0 32 0" fill="none" stroke="#9304F7" stroke-width="2.2"/>
    <text class="spec" x="698" y="88" text-anchor="middle">Data Engineering</text>
  </g>

  <!-- CI/CD & DevOps badge -->
  <g>
    <rect class="card glow g4" x="802" y="10" width="188" height="90" rx="10"/>
    <g stroke="#9304F7" stroke-width="2.2" fill="none">
      <path d="M878 30 a12 12 0 1 1 -0.1 0"/>
      <path d="M878 18 l-4 5 M878 18 l4 5" stroke-linecap="round"/>
      <path d="M914 52 a12 12 0 1 1 -0.1 0"/>
      <path d="M914 64 l-4 -5 M914 64 l4 -5" stroke-linecap="round"/>
    </g>
    <text class="spec" x="896" y="88" text-anchor="middle">CI/CD &amp; DevOps</text>
  </g>
</svg>
