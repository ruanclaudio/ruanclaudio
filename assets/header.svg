<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Ruan Cláudio - Software Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Ruan Cláudio — Software Engineer</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1A0626"/>
      <stop offset="55%"  stop-color="#2B0B3F"/>
      <stop offset="100%" stop-color="#5C1170"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="1000" height="220" rx="12"/>
    </clipPath>
  </defs>

  <style>
    .tw { animation: tw 3s ease-in-out infinite; }
    .d1 { animation-delay: -0.4s; }
    .d2 { animation-delay: -1.1s; }
    .d3 { animation-delay: -1.9s; }
    .d4 { animation-delay: -2.5s; }

    @keyframes tw {
      0%, 100% { opacity: 0.15; }
      50%      { opacity: 0.95; }
    }

    #wave-back  { animation: roll 11s linear infinite; }
    #wave-front { animation: roll 7s linear infinite reverse; }

    @keyframes roll {
      from { transform: translateX(0); }
      to   { transform: translateX(-700px); }
    }

    .name {
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 54px; font-weight: 700; fill: #FFFFFF; letter-spacing: 2px;
    }
    .role {
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 17px; font-weight: 600; fill: #D9B8F5; letter-spacing: 7px;
    }
  </style>

  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="1000" height="220" fill="url(#sky)"/>

    <g fill="#FFFFFF">
      <circle class="tw"    cx="80"  cy="38"  r="1.8"/>
      <circle class="tw d1" cx="210" cy="66"  r="1.3"/>
      <circle class="tw d2" cx="340" cy="28"  r="2.0"/>
      <circle class="tw d3" cx="480" cy="52"  r="1.4"/>
      <circle class="tw d4" cx="620" cy="30"  r="1.7"/>
      <circle class="tw d1" cx="760" cy="62"  r="1.2"/>
      <circle class="tw d3" cx="890" cy="36"  r="1.9"/>
      <circle class="tw d2" cx="940" cy="82"  r="1.3"/>
      <circle class="tw d4" cx="140" cy="96"  r="1.2"/>
    </g>

    <text class="name" x="500" y="108" text-anchor="middle">RUAN CLÁUDIO</text>
    <text class="role" x="500" y="140" text-anchor="middle">SOFTWARE ENGINEER</text>

    <g id="wave-back" opacity="0.45">
      <path d="M0,172 Q87,150 175,172 T350,172 T525,172 T700,172 T875,172 T1050,172 T1225,172 T1400,172 T1575,172 V240 H0 Z" fill="#8F0D87"/>
    </g>

    <g id="wave-front" opacity="0.85">
      <path d="M-700,186 Q-612,166 -525,186 T-350,186 T-175,186 T0,186 T175,186 T350,186 T525,186 T700,186 T875,186 T1050,186 V240 H-700 Z" fill="#9304F7"/>
    </g>
  </g>
</svg>
