<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 130" width="1000" height="130" role="img" aria-label="First, solve the problem. Then, write the code. - John Johnson" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>"First, solve the problem. Then, write the code." — John Johnson</title>

  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#2B0B3F"/>
      <stop offset="50%"  stop-color="#4A1866"/>
      <stop offset="100%" stop-color="#2B0B3F"/>
    </linearGradient>
  </defs>

  <style>
    .quote {
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 25px; font-weight: 600; font-style: italic; fill: #F2E9FA;
    }
    .author {
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px; font-weight: 600; fill: #9304F7; letter-spacing: 1px;
    }
    .mark { fill: #8F0D87; opacity: 0.5; }
    .glow { animation: pulse 4.5s ease-in-out infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 0.9; }
      50%      { opacity: 0.55; }
    }
  </style>

  <rect x="4" y="4" width="992" height="122" rx="14" fill="url(#tg)" stroke="#8F0D87" stroke-width="1.4"/>

  <text class="mark" x="40" y="72" font-size="80" font-family="Georgia, serif">&#8220;</text>

  <text class="quote glow" x="500" y="58" text-anchor="middle">
    First, solve the problem.<tspan x="500" dy="34">Then, write the code.</tspan>
  </text>

  <text class="author" x="500" y="112" text-anchor="middle">— JOHN JOHNSON</text>
</svg>
