<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 170" width="800" height="170" role="img" aria-label="Rocket flying through space" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Passionate about code and astrophysics</title>

  <style>
    .star { fill: #C9A7F5; }
    .star-b { fill: #FFFFFF; }
    .tw1 { animation: tw 2.6s ease-in-out infinite; }
    .tw2 { animation: tw 3.4s ease-in-out infinite; animation-delay: -1.2s; }
    .tw3 { animation: tw 2.0s ease-in-out infinite; animation-delay: -0.6s; }
    .tw4 { animation: tw 4.2s ease-in-out infinite; animation-delay: -2.1s; }

    @keyframes tw {
      0%, 100% { opacity: 0.20; }
      50%      { opacity: 1.00; }
    }

    #ship { animation: fly 9s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }

    @keyframes fly {
      0%   { transform: translate(-140px, 150px); }
      100% { transform: translate(880px, -70px); }
    }

    #flame { animation: burn 0.16s steps(2, end) infinite; transform-origin: 0px 0px; }

    @keyframes burn {
      0%   { transform: scaleX(1) scaleY(1); opacity: 1; }
      100% { transform: scaleX(0.78) scaleY(1.06); opacity: 0.82; }
    }

    #planet { animation: drift 16s linear infinite; }

    @keyframes drift {
      0%, 100% { transform: translateY(0px); }
      50%      { transform: translateY(-9px); }
    }
  </style>

  <!-- starfield -->
  <g>
    <circle class="star tw1"   cx="42"  cy="30"  r="1.7"/>
    <circle class="star-b tw3" cx="96"  cy="112" r="1.2"/>
    <circle class="star tw2"   cx="150" cy="58"  r="2.1"/>
    <circle class="star tw4"   cx="196" cy="136" r="1.4"/>
    <circle class="star-b tw1" cx="238" cy="22"  r="1.5"/>
    <circle class="star tw3"   cx="284" cy="92"  r="1.9"/>
    <circle class="star tw2"   cx="330" cy="44"  r="1.2"/>
    <circle class="star-b tw4" cx="378" cy="126" r="1.8"/>
    <circle class="star tw1"   cx="424" cy="70"  r="1.4"/>
    <circle class="star tw3"   cx="470" cy="18"  r="2.0"/>
    <circle class="star-b tw2" cx="512" cy="104" r="1.3"/>
    <circle class="star tw4"   cx="558" cy="52"  r="1.7"/>
    <circle class="star tw1"   cx="604" cy="142" r="1.5"/>
    <circle class="star-b tw3" cx="648" cy="34"  r="1.2"/>
    <circle class="star tw2"   cx="694" cy="88"  r="2.0"/>
    <circle class="star tw4"   cx="740" cy="26"  r="1.4"/>
    <circle class="star-b tw1" cx="772" cy="118" r="1.6"/>
    <circle class="star tw3"   cx="18"  cy="82"  r="1.3"/>
  </g>

  <!-- distant planet -->
  <g id="planet" opacity="0.55">
    <circle cx="690" cy="122" r="21" fill="#4A1866"/>
    <circle cx="683" cy="115" r="4.5" fill="#6B2691"/>
    <circle cx="697" cy="130" r="3.0" fill="#6B2691"/>
    <ellipse cx="690" cy="122" rx="34" ry="7" fill="none" stroke="#9304F7" stroke-width="2.2" opacity="0.8"/>
  </g>

  <!-- rocket -->
  <g id="ship">
    <g transform="rotate(-14)">

      <!-- exhaust trail -->
      <path d="M -26 0 L -150 0" stroke="#8F0D87" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
      <path d="M -26 0 L -96 0" stroke="#9304F7" stroke-width="3" stroke-linecap="round" opacity="0.55"/>

      <!-- flame -->
      <g id="flame">
        <path d="M -22 0 L -54 -8 L -44 0 L -54 8 Z" fill="#9304F7" opacity="0.9"/>
        <path d="M -22 0 L -42 -5 L -35 0 L -42 5 Z" fill="#FFD166"/>
      </g>

      <!-- fins -->
      <path d="M -16 -8 L -30 -22 L -4 -12 Z" fill="#6B2691"/>
      <path d="M -16 8 L -30 22 L -4 12 Z" fill="#6B2691"/>

      <!-- body -->
      <path d="M -20 -11 L 16 -11 Q 40 0 16 11 L -20 11 Q -28 0 -20 -11 Z" fill="#F2F2F7"/>
      <path d="M 16 -11 Q 40 0 16 11 Z" fill="#8F0D87"/>
      <rect x="-14" y="-11" width="7" height="22" fill="#8F0D87" opacity="0.75"/>

      <!-- window -->
      <circle cx="3" cy="0" r="6.5" fill="#2B0B3F"/>
      <circle cx="3" cy="0" r="4.2" fill="#9304F7"/>
      <circle cx="1.4" cy="-1.6" r="1.5" fill="#FFFFFF" opacity="0.85"/>

    </g>
  </g>
</svg>
