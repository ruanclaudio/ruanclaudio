<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="1000" height="120" role="img" aria-label="" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky-f" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1A0626"/>
      <stop offset="55%"  stop-color="#2B0B3F"/>
      <stop offset="100%" stop-color="#5C1170"/>
    </linearGradient>
    <clipPath id="frame-f">
      <rect x="0" y="0" width="1000" height="120" rx="12"/>
    </clipPath>
  </defs>

  <style>
    #wave-back-f  { animation: roll-f 11s linear infinite reverse; }
    #wave-front-f { animation: roll-f 7s linear infinite; }

    @keyframes roll-f {
      from { transform: translateX(0); }
      to   { transform: translateX(-700px); }
    }
  </style>

  <g clip-path="url(#frame-f)">
    <rect x="0" y="34" width="1000" height="86" fill="url(#sky-f)"/>

    <g id="wave-back-f" opacity="0.45">
      <path d="M0,48 Q87,26 175,48 T350,48 T525,48 T700,48 T875,48 T1050,48 T1225,48 T1400,48 T1575,48 V0 H0 Z" fill="#8F0D87"/>
    </g>

    <g id="wave-front-f" opacity="0.85">
      <path d="M-700,34 Q-612,14 -525,34 T-350,34 T-175,34 T0,34 T175,34 T350,34 T525,34 T700,34 T875,34 T1050,34 V0 H-700 Z" fill="#9304F7"/>
    </g>
  </g>
</svg>
